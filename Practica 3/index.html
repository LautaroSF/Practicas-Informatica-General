<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Hola mundo! - Perfil de Lautaro</title>
    <style>
        /* Aquí le damos estilo y color a la página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .tarjeta {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        h2 {
            color: #e74c3c;
            font-size: 1.2em;
            margin-top: 20px;
            margin-bottom: 5px;
        }
        h3 {
            color: #2980b9;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .edad {
            font-size: 1.1em;
            color: #555;
            margin: 0;
        }
        .intereses {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            color: #27ae60;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <h1>Lautaro</h1>
        
        <h2>Edad</h2>
        <p class="edad"><strong>20 AÑOS</strong></p>
        
        <h3>Intereses</h3>
        <div class="intereses">
            <p>¡ME GUSTA TOMODACHI LIFE YEEEEEEEEEEEEEEE!<br>
            Y TAMBIÉN DRAGON BALL ZZZZZZZZZZZZZZZZZZZZZZZZZZZ</p>
        </div>
        
        <!-- Imagen original que proporcionaste -->
        <img src="https://i.pinimg.com/564x/22/be/4e/22be4e54d57e9b08b450e8fdf9fe8064.jpg" alt="Imagen decorativa">
    </div>

</body>
</html>
