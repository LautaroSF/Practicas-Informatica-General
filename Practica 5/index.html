<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organización de la semana</title>
    <style>
        /* Estilos generales de la página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        /* Contenedor principal estilo libreta/agenda */
        .agenda {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            border-top: 6px solid #3498db; /* Borde superior azul */
        }

        /* Estilos para los títulos y textos */
        h1 {
            color: #2c3e50;
            font-size: 1.8em;
            margin-bottom: 5px;
        }
        .subtitulo {
            color: #7f8c8d;
            font-style: italic;
            margin-top: 0;
            margin-bottom: 20px;
        }
        h2 {
            color: #e67e22; /* Color naranja para la otra semana */
            font-size: 1.4em;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 5px;
        }

        /* Estilos para las listas */
        ul, ol {
            padding-left: 0;
            list-style-position: inside;
        }
        li {
            background: #f8f9fa;
            margin-bottom: 8px;
            padding: 12px 15px;
            border-radius: 6px;
            border-left: 4px solid #bdc3c7;
        }
        ul li { 
            border-left-color: #3498db; /* Tareas de esta semana (azul) */
        }
        ol li { 
            border-left-color: #e67e22; /* Tareas de la otra semana (naranja) */
        }
        
        /* Estilo especial para Tomodachi Life */
        .destacado {
            background-color: #fadbd8;
            border-left-color: #e74c3c;
            color: #c0392b;
            font-weight: bold;
        }

        /* Sección del GIF y motivación */
        .motivacion {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #bdc3c7;
        }
        .motivacion p {
            font-weight: bold;
            color: #27ae60;
            font-size: 1.2em;
            text-transform: uppercase;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="agenda">
        <h1>Qué hacer:</h1>
        <p class="subtitulo">Bueno, esto es lo más importante por ahora</p>
        
        <ul>
            <li>Comprar pan</li>
            <li>Estudiar</li>
            <!-- Agregué una clase "destacado" para que resalte -->
            <li class="destacado"><em>JUGAR TOMODACHI LIFE</em></li>
        </ul>
        
        <h2>Cosas para la otra semana</h2>
        <ol>
            <li>Conseguir hoja de calcar</li>
            <li>Terminar toda la tarea</li>
            <li>Seguir estudiando</li>
        </ol>
        
        <div class="motivacion">
            <p>¡Hay que ponerse las pilas!</p>
            <img src="https://media.tenor.com/M0V_eB4IouAAAAAM/anime-noted.gif" alt="Anime tomando nota">
        </div>
    </div>

</body>
</html>
